<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <rect width="300" height="200" fill="#B3E5FC"/>
  <!-- Web Browser Graphic -->
  <g transform="translate(45, 25)">
    <rect x="0" y="0" width="210" height="150" rx="8" fill="#FFFFFF" stroke="#4E342E" stroke-width="4"/>
    <rect x="0" y="0" width="210" height="32" rx="6" fill="#8D6E63" stroke="#4E342E" stroke-width="2"/>
    <!-- URL Address Bar -->
    <rect x="40" y="6" width="155" height="20" rx="4" fill="#FFFFFF" stroke="#4E342E" stroke-width="2"/>
    <text x="50" y="20" font-family="sans-serif" font-size="10" fill="#666">https://www.digilearn.id</text>

    <circle cx="150" cy="95" r="35" fill="#FF7043" stroke="#4E342E" stroke-width="3"/>
    <circle cx="150" cy="95" r="18" fill="#FFE082" stroke="#4E342E" stroke-width="2"/>
    <circle cx="150" cy="95" r="10" fill="#0288D1"/>
  </g>
</svg>
