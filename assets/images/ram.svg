<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <rect width="300" height="200" fill="#DCEDC8"/>
  <!-- RAM Stick Illustration -->
  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="240" height="70" rx="4" fill="#7CB342" stroke="#4E342E" stroke-width="4"/>
    <!-- Gold Pins at Bottom -->
    <rect x="15" y="60" width="210" height="10" fill="#FFF59D" stroke="#4E342E" stroke-width="2"/>
    <!-- Memory Chips -->
    <rect x="20" y="15" width="35" height="35" rx="3" fill="#37474F" stroke="#4E342E" stroke-width="2"/>
    <rect x="70" y="15" width="35" height="35" rx="3" fill="#37474F" stroke="#4E342E" stroke-width="2"/>
    <rect x="120" y="15" width="35" height="35" rx="3" fill="#37474F" stroke="#4E342E" stroke-width="2"/>
    <rect x="170" y="15" width="35" height="35" rx="3" fill="#37474F" stroke="#4E342E" stroke-width="2"/>
  </g>
</svg>
