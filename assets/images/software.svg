<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <rect width="400" height="240" fill="#DCEDC8"/>
  <!-- Pixel grid background -->
  <path d="M0 40 H400 M0 80 H400 M0 120 H400 M0 160 H400 M0 200 H400" stroke="#C5E1A5" stroke-width="1.5"/>
  <path d="M40 0 V240 M80 0 V240 M120 0 V240 M160 0 V240 M200 0 V240 M240 0 V240 M280 0 V240 M320 0 V240 M360 0 V240" stroke="#C5E1A5" stroke-width="1.5"/>

  <!-- Software Windows -->
  <g transform="translate(50, 30)">
    <!-- Back Window -->
    <rect x="20" y="20" width="220" height="140" rx="6" fill="#FFFFFF" stroke="#4E342E" stroke-width="4"/>
    <rect x="20" y="20" width="220" height="30" rx="4" fill="#8D6E63" stroke="#4E342E" stroke-width="2"/>
    <circle cx="35" cy="35" r="4" fill="#FF5252"/>
    <circle cx="48" cy="35" r="4" fill="#FFD740"/>
    <circle cx="61" cy="35" r="4" fill="#69F0AE"/>

    <!-- Front Main Window -->
    <rect x="70" y="45" width="220" height="140" rx="6" fill="#FFFFFF" stroke="#4E342E" stroke-width="4"/>
    <rect x="70" y="45" width="220" height="30" rx="4" fill="#7CB342" stroke="#4E342E" stroke-width="2"/>
    <circle cx="85" cy="60" r="4" fill="#FF5252"/>
    <circle cx="98" cy="60" r="4" fill="#FFD740"/>
    <circle cx="111" cy="60" r="4" fill="#69F0AE"/>

    <!-- App Icons Inside -->
    <!-- Word / Text Icon -->
    <rect x="90" y="90" width="45" height="45" rx="6" fill="#42A5F5" stroke="#4E342E" stroke-width="3"/>
    <text x="105" y="120" font-family="'Press Start 2P', monospace" font-size="18" fill="#FFFFFF">W</text>

    <!-- Browser Icon -->
    <rect x="155" y="90" width="45" height="45" rx="6" fill="#FF7043" stroke="#4E342E" stroke-width="3"/>
    <circle cx="177" cy="112" r="12" fill="#FFE082"/>
    <circle cx="177" cy="112" r="6" fill="#1E88E5"/>

    <!-- Paint Icon -->
    <rect x="220" y="90" width="45" height="45" rx="6" fill="#AB47BC" stroke="#4E342E" stroke-width="3"/>
    <path d="M230 120 L250 100 L255 105 L235 125 Z" fill="#FFE082" stroke="#4E342E" stroke-width="2"/>
  </g>
</svg>
