<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <rect width="300" height="200" fill="#FFF59D"/>
  <!-- Router Graphic -->
  <g transform="translate(45, 40)">
    <!-- Antennas -->
    <line x1="30" y1="50" x2="30" y2="10" stroke="#4E342E" stroke-width="5"/>
    <line x1="180" y1="50" x2="180" y2="10" stroke="#4E342E" stroke-width="5"/>
    
    <!-- Body -->
    <rect x="0" y="50" width="210" height="60" rx="8" fill="#78909C" stroke="#4E342E" stroke-width="4"/>
    <!-- LED Lights -->
    <circle cx="30" cy="80" r="4" fill="#69F0AE"/>
    <circle cx="50" cy="80" r="4" fill="#69F0AE"/>
    <circle cx="70" cy="80" r="4" fill="#69F0AE"/>
    <circle cx="90" cy="80" r="4" fill="#FFD740"/>
  </g>
</svg>
