<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <rect width="300" height="200" fill="#DCEDC8"/>
  <!-- OS Window Graphic -->
  <g transform="translate(45, 25)">
    <rect x="0" y="0" width="210" height="150" rx="8" fill="#FFFFFF" stroke="#4E342E" stroke-width="4"/>
    <rect x="0" y="0" width="210" height="30" rx="6" fill="#7CB342" stroke="#4E342E" stroke-width="2"/>
    <circle cx="15" cy="15" r="4" fill="#FF5252"/>
    <circle cx="28" cy="15" r="4" fill="#FFD740"/>
    <circle cx="41" cy="15" r="4" fill="#69F0AE"/>
    
    <!-- OS Logos Grid -->
    <rect x="25" y="50" width="45" height="45" rx="6" fill="#0288D1" stroke="#4E342E" stroke-width="2"/>
    <text x="47" y="78" font-family="'Press Start 2P', monospace" font-size="14" fill="#FFFFFF" text-anchor="middle">Win</text>
    
    <rect x="82" y="50" width="45" height="45" rx="6" fill="#5D4037" stroke="#4E342E" stroke-width="2"/>
    <text x="104" y="78" font-family="'Press Start 2P', monospace" font-size="14" fill="#FFFFFF" text-anchor="middle">Mac</text>

    <rect x="140" y="50" width="45" height="45" rx="6" fill="#FF8F00" stroke="#4E342E" stroke-width="2"/>
    <text x="162" y="78" font-family="'Press Start 2P', monospace" font-size="14" fill="#FFFFFF" text-anchor="middle">Lnx</text>
  </g>
</svg>
