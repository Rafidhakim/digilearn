<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <rect width="300" height="200" fill="#FFF59D"/>
  <!-- Office Apps Graphic -->
  <g transform="translate(40, 40)">
    <!-- Word -->
    <rect x="15" y="15" width="55" height="75" rx="6" fill="#1976D2" stroke="#4E342E" stroke-width="3"/>
    <text x="42" y="60" font-family="'Press Start 2P', monospace" font-size="20" fill="#FFFFFF" text-anchor="middle">W</text>
    
    <!-- Excel -->
    <rect x="80" y="15" width="55" height="75" rx="6" fill="#2E7D32" stroke="#4E342E" stroke-width="3"/>
    <text x="107" y="60" font-family="'Press Start 2P', monospace" font-size="20" fill="#FFFFFF" text-anchor="middle">X</text>

    <!-- PowerPoint -->
    <rect x="145" y="15" width="55" height="75" rx="6" fill="#D84315" stroke="#4E342E" stroke-width="3"/>
    <text x="172" y="60" font-family="'Press Start 2P', monospace" font-size="20" fill="#FFFFFF" text-anchor="middle">P</text>
  </g>
</svg>
