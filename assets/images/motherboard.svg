<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <rect width="300" height="200" fill="#D7CCC8"/>
  <!-- Motherboard Illustration -->
  <g transform="translate(45, 20)">
    <rect x="0" y="0" width="210" height="150" rx="8" fill="#558B2F" stroke="#4E342E" stroke-width="4"/>
    <!-- CPU Socket -->
    <rect x="20" y="20" width="55" height="55" fill="#37474F" stroke="#4E342E" stroke-width="2"/>
    <!-- RAM Slots -->
    <rect x="95" y="20" width="12" height="75" fill="#37474F" stroke="#4E342E" stroke-width="2"/>
    <rect x="115" y="20" width="12" height="75" fill="#37474F" stroke="#4E342E" stroke-width="2"/>
    <!-- PCIe Slot -->
    <rect x="20" y="100" width="120" height="16" fill="#37474F" stroke="#4E342E" stroke-width="2"/>
    <!-- Capacitors -->
    <circle cx="160" cy="40" r="10" fill="#FFF59D" stroke="#4E342E" stroke-width="2"/>
    <circle cx="185" cy="40" r="10" fill="#FFF59D" stroke="#4E342E" stroke-width="2"/>
  </g>
</svg>
