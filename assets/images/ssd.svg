<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <rect width="300" height="200" fill="#FFF59D"/>
  <!-- SSD Drive Illustration -->
  <g transform="translate(60, 30)">
    <rect x="0" y="0" width="180" height="130" rx="8" fill="#546E7A" stroke="#4E342E" stroke-width="4"/>
    <rect x="15" y="15" width="150" height="100" rx="4" fill="#37474F" stroke="#4E342E" stroke-width="2"/>
    <text x="90" y="55" font-family="'Press Start 2P', monospace" font-size="14" fill="#B3E5FC" text-anchor="middle">SSD 512GB</text>
    <text x="90" y="80" font-family="sans-serif" font-weight="bold" font-size="10" fill="#7CB342" text-anchor="middle">HIGH SPEED STORAGE</text>
  </g>
</svg>
