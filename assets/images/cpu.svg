<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <rect width="300" height="200" fill="#B3E5FC"/>
  <!-- CPU Chip Illustration -->
  <g transform="translate(75, 25)">
    <!-- Metallic Pins Base -->
    <rect x="10" y="10" width="130" height="130" rx="10" fill="#FFF59D" stroke="#4E342E" stroke-width="4"/>
    <!-- CPU Heat Spreader -->
    <rect x="25" y="25" width="100" height="100" rx="8" fill="#B0BEC5" stroke="#4E342E" stroke-width="3"/>
    <rect x="35" y="35" width="80" height="80" rx="4" fill="#78909C" stroke="#4E342E" stroke-width="2"/>
    <!-- Brand Stamp -->
    <text x="75" y="70" font-family="'Press Start 2P', monospace" font-size="12" fill="#FFFFFF" text-anchor="middle">CPU</text>
    <text x="75" y="95" font-family="sans-serif" font-weight="bold" font-size="10" fill="#7CB342" text-anchor="middle">PROCESSOR</text>
  </g>
</svg>
