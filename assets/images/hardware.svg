<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <rect width="400" height="240" fill="#B3E5FC"/>
  <!-- Decorative Grid Lines for Pixel feel -->
  <path d="M0 40 H400 M0 80 H400 M0 120 H400 M0 160 H400 M0 200 H400" stroke="#81D4FA" stroke-width="1.5"/>
  <path d="M40 0 V240 M80 0 V240 M120 0 V240 M160 0 V240 M200 0 V240 M240 0 V240 M280 0 V240 M320 0 V240 M360 0 V240" stroke="#81D4FA" stroke-width="1.5"/>

  <!-- Computer Hardware Setup -->
  <g transform="translate(40, 20)">
    <!-- Monitor -->
    <rect x="50" y="40" width="160" height="110" rx="6" fill="#37474F" stroke="#4E342E" stroke-width="4"/>
    <rect x="60" y="50" width="140" height="90" rx="3" fill="#E0F7FA" stroke="#4E342E" stroke-width="3"/>
    <rect x="115" y="150" width="30" height="20" fill="#546E7A" stroke="#4E342E" stroke-width="3"/>
    <rect x="95" y="170" width="70" height="8" fill="#546E7A" stroke="#4E342E" stroke-width="3"/>

    <!-- Screen graphic: RAM & Chip -->
    <rect x="75" y="65" width="45" height="60" rx="4" fill="#7CB342" stroke="#4E342E" stroke-width="2"/>
    <circle cx="97" cy="95" r="12" fill="#5D4037"/>
    
    <rect x="130" y="65" width="55" height="25" rx="3" fill="#8D6E63" stroke="#4E342E" stroke-width="2"/>
    <rect x="130" y="100" width="55" height="25" rx="3" fill="#FFF59D" stroke="#4E342E" stroke-width="2"/>

    <!-- CPU Tower -->
    <rect x="230" y="30" width="65" height="148" rx="6" fill="#78909C" stroke="#4E342E" stroke-width="4"/>
    <circle cx="262" cy="55" r="8" fill="#7CB342" stroke="#4E342E" stroke-width="2"/>
    <rect x="245" y="80" width="35" height="6" fill="#37474F"/>
    <rect x="245" y="95" width="35" height="6" fill="#37474F"/>

    <!-- Mouse & Keyboard -->
    <rect x="40" y="178" width="130" height="12" rx="3" fill="#CFD8DC" stroke="#4E342E" stroke-width="3"/>
    <rect x="190" y="175" width="22" height="15" rx="5" fill="#CFD8DC" stroke="#4E342E" stroke-width="3"/>
  </g>
</svg>
